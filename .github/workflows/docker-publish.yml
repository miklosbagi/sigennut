name: Docker publish

# Deliberately NOT triggered by `on: release` -- release.yml creates
# releases using the default GITHUB_TOKEN, and GitHub's own anti-
# recursion rule means events performed with GITHUB_TOKEN never trigger
# other workflows. Confirmed empirically: the first attempt used
# `on: release: types: [published]` and it silently never fired for
# real releases, only when manually re-run. So instead:
#
# - release.yml calls this directly as a second job in the *same*
#   workflow run (see its `docker-publish` job) -- not a second
#   triggered run, so the GITHUB_TOKEN restriction doesn't apply.
# - workflow_dispatch lets this be re-run by hand for any already-tagged
#   version, e.g. to backfill a release that predates this workflow
#   existing: `gh workflow run docker-publish.yml -f version=0.0.2`.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and push (must match an existing git tag)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            miklosbagi/sigennut:${{ inputs.version }}
            miklosbagi/sigennut:latest
            ghcr.io/miklosbagi/sigennut:${{ inputs.version }}
            ghcr.io/miklosbagi/sigennut:latest
